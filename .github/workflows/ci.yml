name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The default test suite and build need no real credentials — the
          # pilot-application route handler falls back to an in-memory store
          # when Supabase env vars are absent (see
          # src/lib/services/pilot-application-fallback-store.ts). This is
          # the production site URL used for canonical/OG/sitemap metadata
          # during the build; it does not need to be a live secret.
          NEXT_PUBLIC_SITE_URL: https://skumetra.com
