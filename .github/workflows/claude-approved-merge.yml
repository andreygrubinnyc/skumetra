name: Claude — approved merge and production verification

# Merges a pull request that the owner has explicitly approved, then proves the
# result actually reached production.
#
# The approval is bound to a commit, not to a branch. The SHA that was labelled
# is passed to the merge API as its `sha` parameter, so GitHub itself refuses
# the merge if anything was pushed after approval. A stale label cannot merge
# unreviewed code.
#
# `pull_request_target` is deliberately not used: it would run with repository
# secrets in the context of the base branch while the diff is untrusted. The
# consequence is that this workflow definition comes from the head branch. That
# is acceptable here because fork pull requests are rejected outright (and in
# any case receive a read-only token from GitHub), so only an account that
# already has push access could alter this file — and main's ruleset is
# enforced server-side regardless of what any workflow claims. See
# docs/project/CLAUDE_AUTOMATION.md for the full reasoning.

on:
  pull_request:
    types: [labeled]

permissions: {}

concurrency:
  group: claude-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    name: Verify approval and merge
    if: github.event.label.name == 'approved-to-merge'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
      branch: ${{ steps.merge.outputs.branch }}
      issue: ${{ steps.merge.outputs.issue }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The decision logic is read from main, not from the branch being
          # merged, so a pull request cannot relax the rules that judge it.
          ref: main
          persist-credentials: false

      - name: Verify approval and merge
        id: merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const core_ = await import(`${process.env.GITHUB_WORKSPACE}/scripts/automation/automation-core.mjs`)
            const { owner, repo } = context.repo
            const pr = context.payload.pull_request
            const actor = context.payload.sender?.login
            core.setOutput('merged', 'false')

            const stop = async (reason) => {
              core.setFailed(reason)
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `**Merge refused.**\n\n${reason}`,
              })
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: pr.number, name: 'approved-to-merge',
              }).catch(() => {})
            }

            // --- 1. Who applied the approval label ---------------------------
            let permission = null
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: actor,
              })
              permission = data.permission
            } catch (error) {
              // See claude-issue-to-pr.yml: the owner is unambiguous from the
              // payload, so fall back to that rather than deadlocking. Anyone
              // else still fails closed.
              core.warning(`Could not read repository permission for ${actor}: ${error.message}`)
              if (actor && actor === context.payload.repository?.owner?.login) {
                core.info('Actor is the repository owner; treating as admin.')
                permission = 'admin'
              }
            }
            const auth = core_.authorizeActor({ permission, actor })
            if (!auth.ok) return stop(auth.reason)

            // --- 2. Is this pull request even eligible -----------------------
            const eligibility = core_.validatePullRequest({
              labels: pr.labels,
              headRef: pr.head.ref,
              baseRef: pr.base.ref,
              headRepoFullName: pr.head.repo?.full_name ?? '',
              baseRepoFullName: pr.base.repo.full_name,
              authorLogin: pr.user?.login ?? '',
              isFork: Boolean(pr.head.repo?.fork),
              draft: pr.draft,
              state: pr.state,
            })
            if (!eligibility.ok) return stop(eligibility.reason)

            // The commit the owner approved. Everything below is bound to it.
            const approvedSha = pr.head.sha
            core.info(`Approval is bound to ${approvedSha}`)

            // --- 3. Required checks -------------------------------------------
            // Union of the ruleset's required checks and a known baseline. A
            // check added to the ruleset tightens this automatically; one
            // removed from the ruleset cannot loosen it below the baseline.
            const BASELINE = [
              'Lint, typecheck, test, build',
              'Security scans and dependency audit',
              'End-to-end and accessibility tests',
              'Dependency review',
              'CodeQL analysis',
            ]
            const required = new Set(BASELINE)
            try {
              const { data: rules } = await github.request(
                'GET /repos/{owner}/{repo}/rules/branches/{branch}',
                { owner, repo, branch: 'main' },
              )
              for (const rule of rules) {
                if (rule.type !== 'required_status_checks') continue
                for (const c of rule.parameters?.required_status_checks ?? []) {
                  required.add(c.context)
                }
              }
            } catch (error) {
              core.warning(`Could not read branch rules; using the baseline list. ${error.message}`)
            }
            const requiredChecks = [...required]
            core.info(`Required checks: ${requiredChecks.join(', ')}`)

            const DEADLINE = Date.now() + 30 * 60 * 1000
            let verdict = null
            while (Date.now() < DEADLINE) {
              // Re-read the head every pass. If it moved, the approval is void
              // and waiting longer would only merge unreviewed code.
              const { data: fresh } = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number,
              })
              const binding = core_.checkApprovalSha({
                approvedSha, currentSha: fresh.head.sha,
              })
              if (!binding.ok) return stop(binding.reason)

              const [{ data: runs }, { data: statuses }] = await Promise.all([
                github.rest.checks.listForRef({ owner, repo, ref: approvedSha, per_page: 100 }),
                github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: approvedSha, per_page: 100 }),
              ])
              const checkResults = [
                ...runs.check_runs.map((r) => ({
                  name: r.name, status: r.status, conclusion: r.conclusion,
                })),
                ...statuses.statuses.map((s) => ({
                  name: s.context,
                  status: 'completed',
                  conclusion: s.state === 'success' ? 'success' : s.state,
                })),
              ]

              verdict = core_.evaluateRequiredChecks({ requiredChecks, checkResults })
              if (verdict.state === 'failed') {
                return stop(
                  `Required check(s) failed: ${verdict.failed.map((f) => `${f.name} (${f.conclusion})`).join(', ')}`,
                )
              }
              if (verdict.state === 'success') break

              core.info(`Waiting on: ${verdict.pending.map((p) => p.name).join(', ')}`)
              await new Promise((r) => setTimeout(r, 30_000))
            }

            if (verdict?.state !== 'success') {
              return stop(
                `Required checks did not complete within 30 minutes. Still pending: ` +
                `${(verdict?.pending ?? []).map((p) => p.name).join(', ') || 'unknown'}. ` +
                'A check that never reported is not a pass.',
              )
            }

            // --- 4. Merge the exact approved commit ---------------------------
            let merge
            try {
              const { data } = await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number,
                merge_method: 'merge',
                // GitHub refuses the merge server-side if the head has moved.
                sha: approvedSha,
              })
              merge = data
            } catch (error) {
              return stop(`Merge was refused by GitHub: ${error.message}`)
            }

            core.setOutput('merged', 'true')
            core.setOutput('merge_sha', merge.sha)
            core.setOutput('branch', pr.head.ref)

            // The branch name is generated and validated by automation-core;
            // the pull-request body is prose a run can forget to write. Prefer
            // the branch and fall back to the body.
            const fromBranch = core_.issueNumberFromBranch(pr.head.ref)
            const fromBody = (pr.body ?? '').match(/(?:closes|fixes|resolves)\s+#(\d+)/i)
            core.setOutput('issue', String(fromBranch ?? fromBody?.[1] ?? ''))

            core.info(`Merged as ${merge.sha}`)

  verify-production:
    name: Verify production, close the issue and clean up
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Wait for the deployment and verify production
        id: smoke
        continue-on-error: true
        env:
          EXPECT_COMMIT: ${{ needs.merge.outputs.merge_sha }}
        run: node scripts/automation/production-smoke.mjs

      - name: Record the outcome
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          MERGE_SHA: ${{ needs.merge.outputs.merge_sha }}
          CLAUDE_BRANCH: ${{ needs.merge.outputs.branch }}
          LINKED_ISSUE: ${{ needs.merge.outputs.issue }}
        with:
          script: |
            const core_ = await import(`${process.env.GITHUB_WORKSPACE}/scripts/automation/automation-core.mjs`)
            const { owner, repo } = context.repo
            const passed = process.env.SMOKE_OUTCOME === 'success'
            const sha = process.env.MERGE_SHA
            const branch = process.env.CLAUDE_BRANCH
            const issueNumber = Number(process.env.LINKED_ISSUE || 0)

            if (!passed) {
              // Never quietly roll back or paper over this. Surface it, label
              // it, and leave the branch in place for investigation.
              core.setFailed('Production verification failed after merge.')
              if (issueNumber) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issueNumber,
                  labels: ['production-verification-failed'],
                }).catch(() => {})
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: [
                    `**Production verification failed after merging \`${sha}\`.**`,
                    '',
                    'The merge is on `main`. Production did not verify clean, so this needs a',
                    'human decision — no automatic rollback was performed and the branch was',
                    'left in place. See the workflow run for the failing checks.',
                  ].join('\n'),
                }).catch(() => {})
              }
              return
            }

            if (issueNumber) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `Merged as \`${sha}\` and verified live in production.`,
              }).catch(() => {})
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issueNumber, labels: ['completed'],
              }).catch(() => {})
              for (const name of ['ready-for-claude', 'claude-in-progress', 'owner-review']) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: issueNumber, name,
                }).catch(() => {})
              }
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber, state: 'closed', state_reason: 'completed',
              }).catch(() => {})
            }

            // Allow-list, not deny-list: anything that is not a recognised
            // Claude task branch is left alone.
            const deletable = core_.isBranchDeletable(branch)
            if (!deletable.ok) {
              core.info(`Not deleting "${branch}": ${deletable.reason}`)
              return
            }
            await github.rest.git.deleteRef({
              owner, repo, ref: `heads/${branch}`,
            }).catch((error) => core.warning(`Could not delete ${branch}: ${error.message}`))
