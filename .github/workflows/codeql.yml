name: CodeQL

# Static analysis for JavaScript/TypeScript. Runs on pull requests, on pushes
# to main, and weekly — the schedule matters because new queries ship after
# code is written, so a repository that only scans on change goes stale.

on:
  pull_request:
    branches: [main]
  push:
    # See ci.yml: a Claude task branch needs its required checks to land on the
    # pushed SHA, because the pull request that follows cannot trigger them.
    branches: [main, 'claude/issue-*']
  schedule:
    # Mondays 06:17 UTC. Off the hour to avoid the top-of-hour runner queue.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required for CodeQL to upload its results to the Security tab.
      security-events: write
      # Needed by the action to read the repository contents.
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # Single language: this repository is TypeScript/JavaScript only.
          # A wider matrix would fail on languages that are not present.
          languages: javascript-typescript
          queries: security-extended

      # No manual build step: JavaScript/TypeScript is analysed directly from
      # source, so a Next.js production build would only add time.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:javascript-typescript'
