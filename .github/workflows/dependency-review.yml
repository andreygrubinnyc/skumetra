name: Dependency Review

# Compares the dependency manifest/lockfile between the base and head of a
# pull request and fails when the change introduces a known-vulnerable
# package. This catches a bad dependency at review time rather than after it
# has already shipped.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dep-review-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block only newly introduced high/critical advisories. Lower
          # severities are handled by Dependabot rather than blocking review.
          fail-on-severity: high
          # No license policy is declared: none has been approved for this
          # project, and inventing one would block contributions on a rule
          # nobody agreed to.
          comment-summary-in-pr: never

      - name: Review exact main-commit dependency changes
        if: github.event_name == 'push'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Non-PR events require both refs explicitly. This makes the
          # Dependency review check attach to the exact pushed main SHA and
          # compare it with the commit main pointed to immediately before it.
          base-ref: ${{ github.event.before }}
          head-ref: ${{ github.sha }}
          fail-on-severity: high
          comment-summary-in-pr: never
